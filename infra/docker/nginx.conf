# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Hostinger VPS.
#
# Runs on the HOST rather than in a container so certbot's renewal hook is
# straightforward and TLS survives a full `docker compose down`.
#
# Install to /etc/nginx/sites-available/hixaa-dms and symlink into sites-enabled.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limit zones. Auth is far stricter than the rest of the API: credential
# stuffing is the highest-volume attack this application will actually see.
limit_req_zone $binary_remote_addr zone=api:10m   rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream hixaa_api { server 127.0.0.1:4000; keepalive 32; }
upstream hixaa_web { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name dms.hixaa.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dms.hixaa.com;

    ssl_certificate     /etc/letsencrypt/live/dms.hixaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.hixaa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Large enough for CAD/STEP drawings (UPLOAD_MAX_SIZE_DRAWING_MB).
    client_max_body_size 50m;
    client_body_timeout  60s;

    limit_conn conn 50;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/problem+json text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/hixaa-dms.access.log;
    error_log  /var/log/nginx/hixaa-dms.error.log warn;

    # ── Auth: strictest limit ───────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://hixaa_api;
        include /etc/nginx/snippets/hixaa-proxy.conf;
    }

    # ── Server-Sent Events: buffering must be off or nothing streams ────────
    location /api/v1/notifications/stream {
        proxy_pass http://hixaa_api;
        include /etc/nginx/snippets/hixaa-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://hixaa_api;
        include /etc/nginx/snippets/hixaa-proxy.conf;
        # Reports and exports return 202 immediately, but a large PDF stream
        # still needs room to finish.
        proxy_read_timeout 120s;
    }

    # ── Health: unauthenticated, excluded from the API prefix ───────────────
    location /health/ {
        proxy_pass http://hixaa_api;
        include /etc/nginx/snippets/hixaa-proxy.conf;
        access_log off;
    }

    # ── Next.js immutable build assets ──────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://hixaa_web;
        include /etc/nginx/snippets/hixaa-proxy.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Admin Portal ────────────────────────────────────────────────────────
    location / {
        proxy_pass http://hixaa_web;
        include /etc/nginx/snippets/hixaa-proxy.conf;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
