# ─────────────────────────────────────────────────────────────────────────────
# Production stack — Hostinger VPS.
#
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.production up -d
#
# Note what is NOT here: Postgres and Redis publish no ports. They are reachable
# only on the internal network. An exposed database port on a public VPS is
# scanned and attacked within hours — this is the single most important line in
# the file. See docs/10-deployment.md §1.
# ─────────────────────────────────────────────────────────────────────────────
name: hixaa-dms

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1536M }
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *default-logging

  # One-shot. `service_completed_successfully` below guarantees migrations
  # finish before the API or worker starts, and run exactly once even when the
  # API is scaled to several replicas.
  migrate:
    image: ${REGISTRY:-hixaa}/api:${TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    # --schema is explicit because prisma.config.ts is deliberately NOT shipped
    # to the runtime image: it is TypeScript and would need a loader. Env comes
    # from env_file instead.
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--schema', 'prisma/schema.prisma']
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [../../.env.production]
    networks: [internal]
    restart: 'no'
    logging: *default-logging

  api:
    image: ${REGISTRY:-hixaa}/api:${TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    env_file: [../../.env.production]
    environment:
      # The API must never drain the outbox — that is the worker's job, and two
      # processes doing it is wasted work. See infrastructure/outbox.
      WORKER_ENABLED: 'false'
    ports:
      - '127.0.0.1:4000:4000' # loopback only; Nginx is the sole public entry
    volumes:
      - uploads:/var/hixaa/uploads
    networks: [internal, web]
    deploy:
      resources:
        limits: { memory: 768M }
    logging: *default-logging

  worker:
    image: ${REGISTRY:-hixaa}/api:${TAG:-latest}
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    env_file: [../../.env.production]
    environment:
      WORKER_ENABLED: 'true'
    volumes:
      - uploads:/var/hixaa/uploads
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  web:
    image: ${REGISTRY:-hixaa}/web:${TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
      API_PREFIX: api/v1
    ports:
      - '127.0.0.1:3000:3000'
    networks: [internal, web]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  # `internal: true` means no route to the internet at all — a compromised
  # container cannot exfiltrate over this network.
  internal:
    internal: true
  web:
